<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body { margin:0; padding:0; background:transparent; }
  .icon {
    width:512px; height:512px;
    display:flex; align-items:center; justify-content:center;
    border-radius:112px;
    background: linear-gradient(160deg, #8A95FF 0%, #6C7BFF 100%);
  }
  .glyph {
    font-family: "SF Mono", "Roboto Mono", Consolas, "Menlo", monospace;
    font-weight: 800;
    font-size: 250px;
    letter-spacing: -16px;
    color: #ffffff;
    -webkit-text-stroke: 4px #ffffff;
  }
</style>
</head>
<body>
  <div class="icon"><span class="glyph">&lt;/&gt;</span></div>
</body>
</html>
